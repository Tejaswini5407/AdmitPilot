spring.application.name=admitpilot-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/admitpilot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Excel import configuration (Default: FALSE for safety)
app.import.enabled=false
app.import.default-year=2025
app.import.default-round=Phase 1

# Prediction categorization margins
prediction.safe-margin=0.20
prediction.dream-margin=0.10

# Hibernate JDBC batch processing for high-performance import
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
